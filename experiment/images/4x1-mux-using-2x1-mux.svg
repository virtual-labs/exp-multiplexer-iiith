<svg xmlns="http://www.w3.org/2000/svg" width="540" height="345" viewBox="0 0 540 345" font-family="Arial, Helvetica, sans-serif">
  <title>4 x 1 multiplexer built from three 2 x 1 multiplexers</title>
  <rect width="540" height="345" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="2">
    <!-- 2x1 MUX blocks -->
    <rect x="140" y="40" width="100" height="90"/>
    <rect x="140" y="190" width="100" height="90"/>
    <rect x="330" y="115" width="100" height="90"/>
    <!-- data inputs -->
    <line x1="80" y1="65" x2="140" y2="65"/>
    <line x1="80" y1="105" x2="140" y2="105"/>
    <line x1="80" y1="215" x2="140" y2="215"/>
    <line x1="80" y1="255" x2="140" y2="255"/>
    <!-- S0 to the select inputs of the first two multiplexers -->
    <polyline points="80,160 190,160 190,130"/>
    <polyline points="100,160 100,305 190,305 190,280"/>
    <!-- S1 to the select input of the last multiplexer -->
    <polyline points="80,325 380,325 380,205"/>
    <!-- first stage outputs to the last multiplexer -->
    <polyline points="240,85 285,85 285,140 330,140"/>
    <polyline points="240,235 300,235 300,180 330,180"/>
    <!-- final output -->
    <line x1="430" y1="160" x2="490" y2="160"/>
  </g>
  <circle cx="100" cy="160" r="4" fill="#000000"/>
  <g font-size="16" fill="#000000">
    <text x="50" y="70">I0</text>
    <text x="50" y="110">I1</text>
    <text x="50" y="220">I2</text>
    <text x="50" y="260">I3</text>
    <text x="50" y="165">S0</text>
    <text x="50" y="330">S1</text>
    <text x="498" y="166">Y</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="183" y="90">2 x 1 MUX</text>
    <text x="183" y="240">2 x 1 MUX</text>
    <text x="373" y="165">2 x 1 MUX</text>
  </g>
  <g font-size="11" fill="#333333">
    <text x="145" y="69">I0</text>
    <text x="145" y="109">I1</text>
    <text x="184" y="125">S</text>
    <text x="227" y="89">Y</text>
    <text x="145" y="219">I0</text>
    <text x="145" y="259">I1</text>
    <text x="184" y="275">S</text>
    <text x="227" y="239">Y</text>
    <text x="335" y="144">I0</text>
    <text x="335" y="184">I1</text>
    <text x="374" y="200">S</text>
    <text x="417" y="164">Y</text>
  </g>
</svg>
